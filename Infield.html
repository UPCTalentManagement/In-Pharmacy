<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>رحلة الفرع</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: mobile-first "aisle". Days are shelf tags; each day = اقرأ → العب → نفّذ في الفرع → سلّم.
   Palette taken from the United Pharmacy logo: navy wordmark, sky blue, teal-green, orange. */
:root{
  --navy:#0B1F77; --blue:#00A8E8; --teal:#00A992; --orange:#F0901E;
  --bg:#F3F6FC; --surface:#FFFFFF; --sunk:#E8EDF8; --line:#D5DCEE;
  --fg:#0B1A4A; --muted:#56628A;
  --primary:var(--navy); --on-primary:#FFFFFF;
  --blue-soft:#DDF3FC; --teal-soft:#D8F3EE; --orange-soft:#FDEBD5; --navy-soft:#E3E7F6;
  --blue-ink:#0077A8; --teal-ink:#007A69; --orange-ink:#B5620A;
  --good:#1E8E4E; --good-soft:#DDF2E5; --bad:#C2413A; --bad-soft:#F8E0DE;
  --logo-chip:transparent;
  --shadow:0 1px 2px rgba(11,31,119,.06),0 6px 20px rgba(11,31,119,.07);
  --f-display:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081033; --surface:#0F1A47; --sunk:#0B143B; --line:#22306A;
  --fg:#E8ECFA; --muted:#A0AAD0;
  --primary:#3FC3F2; --on-primary:#06103A;
  --blue-soft:#0C2C55; --teal-soft:#0B3340; --orange-soft:#3A2810; --navy-soft:#16245E;
  --blue-ink:#6FD3F7; --teal-ink:#4FD9C2; --orange-ink:#F7B15A;
  --good:#4CC17E; --good-soft:#123326; --bad:#EE7C74; --bad-soft:#3A1C1E;
  --logo-chip:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081033; --surface:#0F1A47; --sunk:#0B143B; --line:#22306A;
  --fg:#E8ECFA; --muted:#A0AAD0;
  --primary:#3FC3F2; --on-primary:#06103A;
  --blue-soft:#0C2C55; --teal-soft:#0B3340; --orange-soft:#3A2810; --navy-soft:#16245E;
  --blue-ink:#6FD3F7; --teal-ink:#4FD9C2; --orange-ink:#F7B15A;
  --good:#4CC17E; --good-soft:#123326; --bad:#EE7C74; --bad-soft:#3A1C1E;
  --logo-chip:#FFFFFF;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
html{direction:rtl}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.65;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.3;text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%}
.lt{direction:ltr;unicode-bidi:isolate;display:inline-block}
.wrap{max-width:1000px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:8px}
.muted{color:var(--muted)}
.eyebrow{font-size:.78rem;font-weight:700;letter-spacing:.04em;color:var(--blue-ink)}
[hidden]{display:none!important}

/* top bar with the logo's three-colour stroke underneath */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);
  margin-inline:calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-left,0px)) 12px}
.bar::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--orange) 0 33%,var(--teal) 33% 66%,var(--blue) 66%)}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{height:34px;width:auto;display:block;background:var(--logo-chip);border-radius:8px;padding:2px 6px}
.brand span{font-family:var(--f-display);font-weight:700;font-size:1rem;border-inline-start:1px solid var(--line);padding-inline-start:10px}
.bar .sp{flex:1}
.xp{display:flex;align-items:center;gap:8px;min-width:0}
.lvl{font-size:.78rem;font-weight:700;background:var(--orange-soft);color:var(--orange-ink);padding:3px 10px;border-radius:999px;white-space:nowrap}
.xpbar{width:110px;height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--blue));border-radius:99px;transition:width .5s}
.xpnum{font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.nav{display:flex;gap:6px}
.navbtn{background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.86rem;font-weight:600}
.sync{font-size:.75rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sync.ok{background:var(--good-soft);color:var(--good)}
.sync.wait{background:var(--orange-soft);color:var(--orange-ink)}
.sync.demo{background:var(--sunk);color:var(--muted)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:1rem;background:var(--primary);color:var(--on-primary);text-decoration:none}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--blue-ink);border:1.5px solid var(--blue)}
.btn.orange{background:var(--orange);color:#fff}
.btn.teal{background:var(--teal);color:#fff}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:9px 14px;font-size:.92rem}

/* ===== landing ===== */
.hero{padding:36px 0 8px;display:grid;gap:18px}
.hero h1{font-size:clamp(1.9rem,6vw,3.1rem);font-weight:800;color:var(--fg)}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--teal),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{font-size:1.1rem;max-width:60ch;color:var(--muted)}
.reg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;max-width:640px;box-shadow:var(--shadow);display:grid;gap:12px}
.reg .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.reg h2{font-size:1.05rem}
.reg .ok{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
section.blk{margin-top:44px;display:grid;gap:16px}
section.blk>h2{font-size:1.45rem}
.loop{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;counter-reset:s;padding:0;margin:0}
.loop li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:6px;align-content:start}
.loop li::before{counter-increment:s;content:counter(s);font-family:var(--f-display);font-weight:800;font-size:.85rem;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue-ink)}
.loop li.field{background:var(--navy);color:#fff;border-color:var(--navy)}
.loop li.field::before{background:var(--orange);color:#fff}
.loop li.field .muted{color:rgba(255,255,255,.82)}
.loop h3{font-size:1.05rem}
.loop .t{font-size:.78rem;font-weight:600;opacity:.8}
.dayshape{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dayshape .row{display:grid;grid-template-columns:110px 1fr;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:baseline}
.dayshape .row:first-child{border-top:0}
.dayshape .tm{font-variant-numeric:tabular-nums;font-weight:700;color:var(--blue-ink);font-size:.92rem}
.levels{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.levels div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:2px}
.levels b{font-family:var(--f-display)}
.levels span{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rules{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.rule{border-radius:14px;padding:14px;display:grid;gap:4px;border:1px solid var(--line);background:var(--surface)}
.rule b{font-family:var(--f-display);font-size:.95rem}
.rule.yes{border-top:4px solid var(--good)}
.rule.ask{border-top:4px solid var(--orange)}
.rule.no{border-top:4px solid var(--bad)}
.cta{margin-top:36px;display:flex;gap:12px;flex-wrap:wrap}

/* ===== map ===== */
.mapintro{padding:28px 0 6px;display:grid;gap:6px}
.mapintro h1{font-size:clamp(1.5rem,5vw,2.2rem)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge{display:inline-flex;gap:6px;align-items:center;font-size:.82rem;font-weight:600;padding:5px 10px;border-radius:999px;border:1px dashed var(--line);color:var(--muted)}
.badge.on{border-style:solid;border-color:var(--orange);background:var(--orange-soft);color:var(--fg)}
.badge svg{width:14px;height:14px}
.aisle{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
.tag{position:relative;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:6px 16px 16px 6px;padding:14px 16px 14px 14px;display:grid;gap:6px;box-shadow:var(--shadow);min-height:150px;align-content:start}
.tag::after{content:"";position:absolute;inset-inline-start:-1px;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--line)}
.tag.open::after{background:var(--blue)}
.tag.done::after{background:var(--teal)}
.tag .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag .code{font-family:var(--f-display);font-weight:800;font-size:.8rem;letter-spacing:.08em;color:var(--muted)}
.tag .num{font-family:var(--f-display);font-weight:800;font-size:1.6rem;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.tag h3{font-size:1.02rem}
.tag .st{font-size:.78rem;font-weight:700;padding:2px 9px;border-radius:999px;justify-self:start}
.st.locked,.st.soon{background:var(--sunk);color:var(--muted)}
.st.open{background:var(--blue-soft);color:var(--blue-ink)}
.st.done{background:var(--teal-soft);color:var(--teal-ink)}
.tag.locked{opacity:.62}
.tag .mini{font-size:.82rem;color:var(--muted)}
.tag:not(.locked):hover{border-color:var(--blue)}
.previewtoggle{display:flex;gap:8px;align-items:center;font-size:.85rem;color:var(--muted);margin-top:16px}

/* ===== day ===== */
.dayhead{padding:24px 0 6px;display:grid;gap:8px}
.back{background:none;border:0;padding:0;color:var(--blue-ink);font-weight:600;font-size:.92rem;justify-self:start}
.dayhead h1{font-size:clamp(1.6rem,5.5vw,2.4rem)}
.progress{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.progress span{font-size:.8rem;padding:3px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.progress span.ok{background:var(--good-soft);color:var(--good)}
.stage{margin-top:30px;display:grid;gap:12px}
.stage>header{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.stage>header .n{font-family:var(--f-display);font-weight:800;color:var(--orange-ink);font-size:.9rem}
.stage>header h2{font-size:1.25rem}
.pages{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x mandatory}
.pages button{flex:0 0 auto;width:120px;border:1px solid var(--line);border-radius:10px;padding:0;overflow:hidden;background:#fff;scroll-snap-align:start}
.pages img{display:block;width:100%;height:auto}
.dl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:.84rem;color:var(--muted)}

.pairs{display:grid;gap:12px}
.pair{display:grid;grid-template-columns:1fr 34px 1fr;align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.pair .g,.pair .m{padding:14px;display:grid;gap:8px;align-content:start}
.pair .m{background:var(--teal-soft)}
.pair .link{display:grid;place-items:center;background:var(--sunk);color:var(--teal-ink)}
.pair .link svg{width:18px;height:18px}
.pair .k{font-size:.74rem;font-weight:700;letter-spacing:.04em;color:var(--muted)}
.pair .m .k{color:var(--teal-ink)}
.pair h3{font-size:1.05rem}
.pair p{font-size:.9rem}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chip{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.warn{background:var(--orange-soft);color:var(--orange-ink)}

/* ===== 30-item hunt ===== */
.huntbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.huntbar .meter{flex:1;min-width:140px;height:10px;background:var(--sunk);border-radius:99px;overflow:hidden}
.huntbar .meter i{display:block;height:100%;background:linear-gradient(90deg,var(--orange),var(--teal))}
.huntbar b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.84rem;font-weight:600}
.filters button[aria-pressed="true"]{background:var(--navy-soft);border-color:var(--primary);color:var(--fg)}
.hunt{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.hi{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;text-align:start;display:grid;gap:4px;align-content:start;min-height:88px;position:relative}
.hi .nm{font-family:var(--f-display);font-weight:700;font-size:.95rem;direction:ltr;text-align:right}
.hi .ct{font-size:.74rem;color:var(--muted)}
.hi .s{font-size:.72rem;font-weight:700;justify-self:start;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.hi.done{border-color:var(--teal);background:var(--teal-soft)}
.hi.done .s{background:var(--teal);color:#fff}
.hi.miss{border-color:var(--orange)}
.hi.miss .s{background:var(--orange-soft);color:var(--orange-ink)}
.hi.draft .s{background:var(--blue-soft);color:var(--blue-ink)}
.hi:hover{border-color:var(--blue)}

/* ===== leaderboard ===== */
.tabs{display:flex;gap:6px;background:var(--sunk);border-radius:12px;padding:4px;justify-self:start}
.tabs button{border:0;background:transparent;border-radius:9px;padding:7px 16px;font-weight:700;font-size:.92rem;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.board{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.brow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 16px;border-top:1px solid var(--line)}
.brow:first-child{border-top:0}
.brow .rk{font-family:var(--f-display);font-weight:800;font-size:1.1rem;text-align:center;font-variant-numeric:tabular-nums;color:var(--muted)}
.brow.top1 .rk{color:var(--orange-ink)} .brow.top2 .rk{color:var(--blue-ink)} .brow.top3 .rk{color:var(--teal-ink)}
.brow .who{display:grid;min-width:0}
.brow .who b{font-family:var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow .who span{font-size:.82rem;color:var(--muted)}
.brow .pts{font-family:var(--f-display);font-weight:800;font-variant-numeric:tabular-nums;text-align:end}
.brow .pts small{display:block;font-family:var(--f-body);font-weight:600;font-size:.75rem;color:var(--muted)}
.brow.me{background:var(--blue-soft)}
.demo-note{font-size:.84rem;background:var(--orange-soft);border-radius:10px;padding:8px 12px}

/* ===== overlay ===== */
.ov{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 32px) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:760px;margin:0 auto;display:grid;gap:16px}
.ovtop{display:flex;align-items:center;gap:10px;justify-content:space-between}
.ovtop h2{font-size:1.25rem}
.x{background:var(--sunk);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;flex:0 0 auto}
.x svg{width:18px;height:18px}
.hud{display:flex;gap:10px;flex-wrap:wrap}
.hud span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:.88rem;font-variant-numeric:tabular-nums}
.hud b{font-family:var(--f-display)}
.howto{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:.92rem}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcol{display:grid;gap:8px;align-content:start}
.mcol h4{font-size:.8rem;color:var(--muted);font-weight:700}
.card{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;text-align:start;font-weight:600;font-size:.93rem;transition:transform .12s,border-color .12s,background .12s}
.card.mbrand{font-family:var(--f-display);letter-spacing:.02em}
.card.sel{border-color:var(--orange);background:var(--orange-soft)}
.card.ok{border-color:var(--good);background:var(--good-soft);opacity:.7;pointer-events:none}
.card.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.card.no{animation:none}.xpbar i{transition:none}}
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px}
.q .big{font-family:var(--f-display);font-size:1.7rem;font-weight:800;text-align:center;padding:10px 0}
.q .stem{font-size:1.05rem;font-weight:600}
.q .who{font-size:.8rem;font-weight:700;color:var(--orange-ink)}
.opts{display:grid;gap:8px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 14px;text-align:start;font-weight:600}
.opt:hover{border-color:var(--blue)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.fb{border-radius:12px;padding:12px 14px;font-size:.93rem;display:grid;gap:6px}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb.info{background:var(--blue-soft)}
.fb b{font-family:var(--f-display)}
.fb .tip{font-size:.86rem;color:var(--muted)}
.pbar{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--orange)}
.result{text-align:center;display:grid;gap:12px;justify-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 18px}
.result .score{font-family:var(--f-display);font-weight:800;font-size:3rem;color:var(--blue-ink);font-variant-numeric:tabular-nums;line-height:1}
.result .next{background:var(--teal-soft);border-radius:14px;padding:14px;text-align:start;display:grid;gap:6px;width:100%}
.result .next .k{font-size:.78rem;font-weight:700;color:var(--teal-ink)}
.form{display:grid;gap:14px}
.steps{margin:0;padding-inline-start:20px;display:grid;gap:6px}
.fld{display:grid;gap:6px}
.fld label,.fld .lb{font-weight:600;font-size:.92rem}
.fld input[type=text],.fld input[type=email],.fld textarea,.fld select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld .hint{font-size:.8rem;color:var(--muted)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;font-weight:600;font-size:.92rem;background:var(--surface);cursor:pointer}
.seg input{accent-color:var(--teal)}
.seg label:has(input:checked){border-color:var(--teal);background:var(--teal-soft)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:16px;text-align:center;display:grid;gap:8px;justify-items:center;background:var(--surface)}
.drop input{max-width:100%}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.enc{border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;background:var(--surface)}
.enc h4{font-size:.98rem}
.maprow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.maprow:first-child{border-top:0}
.warn{background:var(--bad-soft);border-radius:12px;padding:10px 14px;font-size:.88rem}
.bingo{display:grid;grid-template-columns:1fr;gap:8px}
.bingo button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-weight:600;font-size:.95rem;display:flex;align-items:center;gap:10px;text-align:start}
.bingo button::before{content:"";width:20px;height:20px;border-radius:6px;border:2px solid var(--line);flex:0 0 auto;background:var(--surface)}
.bingo button.on::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 4px var(--teal)}
.bingo button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.viewer img{width:100%;height:auto;border-radius:12px;border:1px solid var(--line);background:#fff}
.vnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);inset-inline:0;margin:auto;width:max-content;max-width:calc(100% - 32px);z-index:40;background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:12px;font-weight:600;box-shadow:var(--shadow)}
.soonlist{display:grid;gap:10px;padding:0;margin:0}
.soonlist li{list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:4px}
.soonlist .k{font-size:.76rem;font-weight:700;color:var(--muted)}

@media (max-width:820px){
  .loop{grid-template-columns:1fr 1fr}
  .aisle{grid-template-columns:1fr 1fr}
  .rules{grid-template-columns:1fr}
  .levels{grid-template-columns:1fr 1fr}
  .hunt{grid-template-columns:repeat(3,1fr)}
  .xpbar{width:64px}
}
@media (max-width:560px){
  .pair{grid-template-columns:1fr}
  .pair .link{padding:4px 0}
  .pair .link svg{transform:rotate(90deg)}
  .aisle{grid-template-columns:1fr}
  .tag{min-height:0}
  .dayshape .row{grid-template-columns:1fr;gap:2px}
  .hunt{grid-template-columns:1fr 1fr}
  .reg .g2{grid-template-columns:1fr}
  .card{font-size:.86rem;padding:10px}
  .brand span{display:none}
  .nav .navbtn.lb{display:none}
}

.flow{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.flow li{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start}
.flow li.hot{background:var(--navy);border-color:var(--navy);color:#fff}
.flow li.hot .chip{background:var(--orange);color:#fff}
.flow .fk{font-size:.78rem;font-weight:700;color:var(--orange-ink)}
.flow li.hot .fk{color:#FFC680}
.flow h3{font-size:1.2rem}
.flow .chip{justify-self:start}
details.ref{margin-top:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
details.ref summary{cursor:pointer;font-weight:700;color:var(--blue-ink)}
details.ref[open]{display:grid;gap:10px}
.prods{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.pc{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:0;overflow:hidden;display:grid;text-align:start}
.pc:hover{border-color:var(--blue)}
.pimg{display:block;aspect-ratio:1/1;max-width:100%;background:#fff;border-bottom:1px solid var(--line)}
.pimg img{width:100%;height:100%;object-fit:contain;display:block}
.ph{width:100%;height:100%;display:grid;place-content:center;justify-items:center;gap:2px;background:repeating-linear-gradient(45deg,var(--sunk) 0 10px,var(--bg) 10px 20px);color:var(--muted)}
.ph b{font-family:var(--f-display);font-size:1.6rem;color:var(--fg)}
.ph span{font-size:.75rem}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:8px 10px}
.pmeta b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.pmeta .s{font-size:.72rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.pc.done{border-color:var(--teal)}
.pc.done .pmeta{background:var(--teal-soft)}
.pc.done .s{background:var(--teal);color:#fff}
.pc.draft .s{background:var(--blue-soft);color:var(--blue-ink)}
.pname{font-size:.75rem;color:var(--muted);padding:0 10px 8px;text-align:left}
.bigimg{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;max-width:360px;width:100%;aspect-ratio:1/1;justify-self:center}
.bigimg img{width:100%;height:100%;object-fit:contain;display:block}
.locked{display:flex;gap:10px;align-items:center;background:var(--orange-soft);border-radius:12px;padding:10px 14px;font-weight:600}
.locked svg{width:20px;height:20px;flex:0 0 auto;color:var(--orange-ink)}
.quizzes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.qz{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:8px;align-content:start;border-top:4px solid var(--orange)}
.qz.off{opacity:.55;border-top-color:var(--line)}
.qz h3{font-size:1.1rem}
.slots{display:grid;gap:12px}
.slot{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;display:grid;gap:8px;min-width:0}
.slot legend{font-weight:700;font-size:.9rem;color:var(--blue-ink);padding:0 6px}
.opt.sel{border-color:var(--orange);background:var(--orange-soft)}
.sfb{font-size:.86rem}
.sfb .okt{color:var(--good)} .sfb .not{color:var(--bad)}
@media (max-width:820px){.prods{grid-template-columns:repeat(3,1fr)}.quizzes{grid-template-columns:1fr}}
@media (max-width:560px){.prods{grid-template-columns:1fr 1fr}.flow{grid-template-columns:1fr}}

function def(){return{user:null,xp:0,games:{},data:{},badges:[],preview:false,outbox:[]}}
function load(){try{const r=localStorage.getItem(KEY);if(r)return Object.assign(def(),JSON.parse(r))}catch(e){}return def()}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}
  catch(e){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e2){}}
}
function level(){let L=LEVELS[0];for(const l of LEVELS)if(S.xp>=l.min)L=l;return L}
function levelOf(xp){let L=LEVELS[0];for(const l of LEVELS)if(xp>=l.min)L=l;return L.n}
function nextLevel(){return LEVELS.find(l=>l.min>S.xp)}
function renderXP(){
  const L=level(),N=nextLevel();
  $('#lvl').textContent=L.n;$('#xpnum').textContent=`${S.xp} XP`;
  $('#xpfill').style.width=Math.min(100,N?((S.xp-L.min)/(N.min-L.min))*100:100)+'%';
  renderSync();
}

/* ================= SYNC (Google Sheets via Apps Script) ================= */
let syncing=false;
function renderSync(){
  const el=$('#sync');if(!el)return;
  if(!CONFIG.SHEETS_URL){el.className='sync demo';el.textContent='وضع تجريبي';return}
  const n=S.outbox.length;
  el.className='sync '+(n?'wait':'ok');el.textContent=n?`${n} في الانتظار`:'متزامن';
}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function send(ev){
  if(!S.user||!CONFIG.SHEETS_URL)return;
  S.outbox.push(Object.assign({eid:uid(),ts:new Date().toISOString(),key:CONFIG.SHARED_KEY,user:S.user,score:'',data:{},photos:[]},ev));
  save();renderSync();flush();
}
async function flush(){
  if(syncing||!CONFIG.SHEETS_URL||!S.outbox.length||!navigator.onLine)return;
  syncing=true;
  try{
    while(S.outbox.length){
      const r=await fetch(CONFIG.SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S.outbox[0])});
      const j=await r.json().catch(()=>({ok:false}));
      if(!j.ok&&!j.duplicate){if(j.error==='bad key')toast('مفتاح الربط غلط. راجع SHARED_KEY');break}
      S.outbox.shift();save();renderSync();
    }
  }catch(e){}
  syncing=false;renderSync();
}
window.addEventListener('online',flush);
setInterval(flush,30000);
function addXP(n,msg,ev){
  if(n>0){S.xp+=n;save();renderXP();toast(`+${n} XP · ${msg}`)}
  if(ev)send(Object.assign({xp:Math.max(0,n)},ev));
}

function $(s){return document.querySelector(s)}
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lt=s=>`<span class="lt">${esc(s)}</span>`;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let toastT;
function toast(m){const r=$('#toastroot');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>r.innerHTML='',2600)}
function go(h){location.hash=h}
const byPic=(day,pic)=>DAYDATA[day].items.find(x=>x.pic===pic)||{pic,b:'',a:'',ck:'',cat:'',sub:''};
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9 ]/g,' ');
const STOP=['extract','leaf','alcohol','sea','water','saline','propionate','furoate','sodium','vitamin','hydroxide','pegol','acid','2','4','rx','aha','retinoid'];
/* كل مكوّن لازم يتكتب. "A / B" معناها إن أي اسم من الاتنين مقبول */
function activeOK(expected,given){
  const g=norm(given);
  const key=p=>{const ws=norm(p).trim().split(/\s+/);return ws.find(w=>w.length>2&&!STOP.includes(w))||ws.find(w=>w.length>1)||ws[0]};
  return expected.split('+').every(part=>part.split('/').some(alt=>g.includes(key(alt).slice(0,5))));
}
const todayStr=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const arDate=s=>{try{return new Date(s+'T00:00:00').toLocaleDateString('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',day:'numeric',month:'long'})}catch(e){return s}};
const imgFallback=n=>`this.onerror=null;this.replaceWith(Object.assign(document.createElement('div'),{className:'ph',innerHTML:'<b>${n}</b><span>صورة المنتج</span>'}))`;

function dayDone(id){const dd=DAYDATA[id];return !!dd&&dataComplete(id)&&dd.quizzes.every(q=>S.games[quizKey(id,q.g)]!==undefined)}

async function loadBoard(){
  boardErr='';
  if(!CONFIG.SHEETS_URL){boardData=null;return}
  try{
    const u=new URL(CONFIG.SHEETS_URL);u.searchParams.set('action','board');
    if(S.user)u.searchParams.set('me',S.user.email);if(CONFIG.SHARED_KEY)u.searchParams.set('key',CONFIG.SHARED_KEY);
    const j=await (await fetch(u.toString())).json();
    if(!j.ok)throw new Error(j.error||'error');boardData=j;
  }catch(e){boardErr='مقدرناش نجيب الترتيب دلوقتي. اتأكد من النت وجرّب تاني.'}
}

  if(!location.hash.startsWith('#board'))return;
  const demo=!CONFIG.SHEETS_URL;
  let data=demo?JSON.parse(JSON.stringify(EXAMPLE)):boardData;
  if(demo&&S.user){
    data.people.push({name:S.user.name+' (إنت)',branch:S.user.branch,xp:S.xp,me:true});
    const br=data.branches.find(b=>b.branch===S.user.branch);if(br){br.xp+=S.xp;br.count++}else data.branches.push({branch:S.user.branch,xp:S.xp,count:1});
  }
  const people=(data?.people||[]).slice().sort((a,b)=>b.xp-a.xp);
  const branches=(data?.branches||[]).map(b=>({...b,avg:Math.round(b.xp/Math.max(1,b.count))})).sort((a,b)=>b.avg-a.avg);
  const rows=boardTab==='people'
    ? people.map((p,i)=>`<div class="brow ${i<3?'top'+(i+1):''} ${p.me?'me':''}"><span class="rk">${i+1}</span><span class="who"><b>${esc(p.name)}</b><span>${esc(p.branch)} · ${esc(levelOf(p.xp))}</span></span><span class="pts">${p.xp}<small>XP</small></span></div>`).join('')
    : branches.map((b,i)=>`<div class="brow ${i<3?'top'+(i+1):''} ${S.user&&b.branch===S.user.branch?'me':''}"><span class="rk">${i+1}</span><span class="who"><b>${esc(b.branch)}</b><span>${b.count} متدرب · إجمالي ${b.xp} XP</span></span><span class="pts">${b.avg}<small>متوسط XP</small></span></div>`).join('');
  $('#app').innerHTML=`
  <section class="mapintro"><span class="eyebrow">Leaderboard</span><h1>الترتيب</h1>
    <p class="muted">ترتيب الفروع بمتوسط النقط لكل متدرب، عشان الفرع اللي فيه متدرب واحد ميتظلمش.</p></section>
  <div style="display:grid;gap:12px;margin-top:12px">
    ${demo?'<p class="demo-note">وضع تجريبي: الأسماء دي أمثلة توضيحية. لما تربط Google Sheet الترتيب هيبقى حقيقي.</p>':''}
    ${boardErr?`<div class="fb no"><span>${esc(boardErr)}</span></div>`:''}
    <div class="tabs" role="tablist"><button role="tab" data-bt="people" aria-selected="${boardTab==='people'}">المتدربين</button><button role="tab" data-bt="branches" aria-selected="${boardTab==='branches'}">الفروع</button></div>
    <div class="board">${rows||'<div class="brow"><span></span><span class="muted">لسه مفيش نقط مسجلة.</span><span></span></div>'}</div>
    ${CONFIG.SHEETS_URL?'<button class="btn ghost sm" data-go-refresh style="justify-self:start">تحديث</button>':''}
  </div>`;
}

/* ================= OVERLAY ================= */
let timer;
function openOv(html){$('#ovroot').innerHTML=`<div class="ov" role="dialog" aria-modal="true"><div class="ov-in">${html}</div></div>`;document.body.style.overflow='hidden';const f=$('#ovroot .x');f&&f.focus()}
function killOv(){clearInterval(timer);$('#ovroot').onclick=null;$('#ovroot').innerHTML='';document.body.style.overflow=''}
function closeOv(){killOv();route(true)}
const ovTop=t=>`<div class="ovtop"><h2>${t}</h2><button class="x" data-close aria-label="اقفل">${ICON.x}</button></div>`;
function viewer(p){
  const PAGES=(DAYS.find(d=>d.pages&&d.pages.includes(p))||{pages:[p]}).pages,i=PAGES.indexOf(p);
  openOv(`${ovTop('شجرة اليوم')}<div class="viewer"><img src="trees/${p}.jpg" alt="صفحة ${i+1} من الشجرة"></div>
   <div class="vnav"><button class="btn ghost sm" ${i>0?`data-view="${PAGES[i-1]}"`:'disabled'}>السابقة</button><span class="muted">${i+1} / ${PAGES.length}</span><button class="btn ghost sm" ${i<PAGES.length-1?`data-view="${PAGES[i+1]}"`:'disabled'}>التالية</button></div>`);
}

/* ================= المرحلة الأولى: جمع البيانات ================= */
function productForm(v){
  if(needUser())return;
  const day=+v.split(':')[0],pic=+v.split(':')[1],dd=DAYDATA[day];
  const P=products(day),idx=P.findIndex(p=>p[0]===pic),b=P[idx][1],x=byPic(day,pic),h=S.data[pic]||{},f=h.f||{};
  const next=P.slice(idx+1).concat(P.slice(0,idx)).find(([n])=>!(S.data[n]&&S.data[n].sent));
  const reveal=!h.sent?'':`<div class="fb ${x.ck?(h.correct?'ok':'no'):'info'}"><b>${x.ck?(h.correct?(dd.mode==='cosmetic'?'المكوّن الأساسي صح':'المادة الفعالة صح'):(dd.mode==='cosmetic'?'راجع المكونات':'راجع المادة الفعالة')):'اتسلّم'}</b>
    <span>المنتج: ${lt(b)}${x.a?' · '+lt(x.a):''}</span><span class="tip">باقي البيانات بيراجعها فريق التدريب.</span></div>`;
  openOv(`${ovTop('منتج رقم '+pic)}
   <form class="form" id="pf" novalidate>
    <div class="bigimg"><img src="${CONFIG.PIC(pic)}" alt="صورة المنتج رقم ${pic}" onerror="${imgFallback(pic)}"></div>
    ${S.preview?`<p class="note">وضع المعاينة: ${lt(b)}</p>`:''}
    ${reveal}
    ${FIELDS[dd.mode].map(([id,lab,dir,ph])=>`<div class="fld"><label for="${id}">${lab}</label>${id==='ha'||id==='hs'
      ?`<input type="text" id="${id}" dir="${dir}" value="${esc(f[id])}" placeholder="${esc(ph)}">`
      :`<textarea id="${id}" dir="${dir}" placeholder="${esc(ph)}">${esc(f[id])}</textarea>`}</div>`).join('')}
    <div id="err"></div>
    <div class="acts"><button class="btn orange" type="submit">${h.sent?'سلّم التعديل':'سلّم'}</button><button class="btn ghost" type="button" id="draft">احفظ مسودة</button></div>
   </form>`);
  const collect=()=>Object.fromEntries(FIELDS[dd.mode].map(([id])=>[id,$('#'+id).value.trim()]));
  $('#draft').onclick=()=>{S.data[pic]=Object.assign({},S.data[pic],{f:collect()});save();toast('اتحفظت المسودة');closeOv()};
  $('#pf').onsubmit=e=>{
    e.preventDefault();
    const val=collect();
    if(FIELDS[dd.mode].some(([id])=>!val[id])){$('#err').innerHTML=`<div class="fb no"><span>كمّل الـ 4 خانات: ${FIELDS[dd.mode].map(x=>x[1]).join('، ')}.</span></div>`;return}
    const wasDone=dataComplete(day);
    const correct=!!x.ck&&activeOK(x.ck,val.ha);
    const earned=CONFIG.XP_PER_PRODUCT+(correct||!x.ck?CONFIG.XP_ACTIVE_BONUS:0);
    const gain=Math.max(0,earned-(h.xp||0));
    S.data[pic]={f:val,sent:true,correct,xp:Math.max(h.xp||0,earned)};save();
    addXP(gain,correct?'المادة الفعالة صح':'منتج اتسلّم',{type:'product',day,item:b,score:x.ck?(correct?1:0):'',
      data:{pic,product:b,active:val.ha,uses:val.hu,strengths:val.hs,dose:val.hd,expected_active:x.a||'',category:(x.cat?x.cat+' / ':'')+(x.sub||'')}});
    checkDayBadges(day);
    if(!wasDone&&dataComplete(day)){killOv();route(true);toast('خلّصت المرحلة الأولى! التحديات اتفتحت');setTimeout(()=>{const q=$('#quiz');q&&q.scrollIntoView({behavior:'smooth'})},400);return}
    if(next&&!h.sent){productForm(`${day}:${next[0]}`);return}
    productForm(v);
  };
}

/* ================= المرحلة التانية: التحديات ================= */
function finish(day,gid,score,max){
  const key=quizKey(day,gid),q=DAYDATA[day].quizzes.find(x=>x.g===gid);
  const pct=Math.round(score/max*100),prev=S.games[key];
  const gain=Math.round(Math.max(0,pct-(prev||0))*CONFIG.XP_QUIZ_MAX/100);
  S.games[key]=Math.max(prev||0,pct);save();
  addXP(gain,q.t,{type:'game',day,item:gid,score:pct});
  if(pct===100)award('perfect');
  checkDayBadges(day);
  openOv(`${ovTop(esc(q.t))}
   <div class="result"><span class="muted">نتيجتك</span><span class="score">${pct}%</span>
     <p class="muted">${gain>0?`كسبت ${gain} XP. `:''}${pct>=80?'ممتاز.':'تقدر تلعب تاني وتحسّن نتيجتك. النقط بتتحسب على الفرق بس.'}</p>
     <div class="acts" style="justify-content:center"><button class="btn orange" data-play="${day}:${gid}">العب تاني</button><button class="btn ghost" data-close>رجوع لليوم</button></div>
   </div>`);
}
function gameMatch(day){
  const dd=DAYDATA[day];
  const V=x=>dd.matchField==='sub'?x.sub:x.a;
  const pool=shuffle(dd.items.filter(x=>dd.matchField==='sub'||x.ck).filter((x,i,arr)=>arr.findIndex(y=>V(y)===V(x))===i)).slice(0,6);
  const brands=shuffle(pool),acts=shuffle(pool);
  let sel=null,score=0,matched=0,t=75,miss=0;
  openOv(`${ovTop('Match Rush')}
   <div class="hud"><span>الوقت <b id="mt">${t}</b></span><span>نقط <b id="ms">0</b></span><span>غلط <b id="mm">0</b></span></div>
   <p class="howto">اختار المنتج من العمود الأول، وبعدين ${esc(dd.matchLabel)} بتاعه من التاني.</p>
   <div class="mgrid">
     <div class="mcol"><h4>المنتج</h4>${brands.map(x=>`<button class="card mbrand" data-b="${esc(x.b)}"><span class="lt">${esc(x.b)}</span></button>`).join('')}</div>
     <div class="mcol"><h4>${esc(dd.matchLabel)}</h4>${acts.map(x=>`<button class="card" data-a="${esc(x.b)}"><span class="lt">${esc(V(x))}</span></button>`).join('')}</div>
   </div>`);
  let ended=false;
  const end=()=>{if(ended)return;ended=true;clearInterval(timer);finish(day,'match',Math.max(0,score+Math.round(t/3)),85)};
  timer=setInterval(()=>{t--;const el=$('#mt');if(el)el.textContent=t;if(t<=0)end()},1000);
  $('#ovroot').onclick=e=>{
    const b=e.target.closest('[data-b]'),a=e.target.closest('[data-a]');
    if(b){document.querySelectorAll('[data-b].sel').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');sel=b;return}
    if(a&&sel){
      if(a.dataset.a===sel.dataset.b){a.classList.add('ok');sel.classList.remove('sel');sel.classList.add('ok');score+=10;matched++;sel=null;if(matched===pool.length)end()}
      else{a.classList.add('no');setTimeout(()=>a.classList.remove('no'),350);score=Math.max(0,score-3);miss++}
      $('#ms')&&($('#ms').textContent=score);$('#mm')&&($('#mm').textContent=miss);
    }
  };
}
function runMC(day,gid,title,items,render){
  let i=0,score=0;
  const step=()=>{
    const it=items[i];
    openOv(`${ovTop(title)}<div class="pbar"><i style="width:${i/items.length*100}%"></i></div>
     <div class="hud"><span>سؤال <b>${i+1}</b> من ${items.length}</span><span>صح <b>${score}</b></span></div>${render(it)}<div id="fbx"></div>`);
    $('#ovroot').onclick=e=>{
      const o=e.target.closest('[data-o]');
      if(o&&!o.disabled){
        const k=+o.dataset.o,right=k===it.ok;if(right)score++;
        document.querySelectorAll('[data-o]').forEach(b=>{b.disabled=true;if(+b.dataset.o===it.ok)b.classList.add('ok')});
        if(!right)o.classList.add('no');
        $('#fbx').innerHTML=`<div class="fb ${right?'ok':'no'}"><b>${right?'صح':'مش ده'}</b><span>${it.why}</span></div>
          <div style="margin-top:12px"><button class="btn" id="nx">${i<items.length-1?'التالي':'النتيجة'}</button></div>`;
        $('#nx').focus();
        $('#nx').onclick=ev=>{ev.stopPropagation();i++;if(i<items.length)step();else finish(day,gid,score,items.length)};
      }
    };
  };
  step();
}
function gameSort(day){
  const items0=DAYDATA[day].items,subs=[...new Set(items0.map(x=>x.sub))];
  const items=shuffle(items0).slice(0,10).map(x=>{
    const same=subs.filter(s=>s!==x.sub&&items0.find(y=>y.sub===s).cat===x.cat);
    const other=subs.filter(s=>s!==x.sub&&!same.includes(s));
    const opts=shuffle([x.sub,...shuffle(same).slice(0,2).concat(shuffle(other)).slice(0,3)]);
    return{b:x.b,opts,ok:opts.indexOf(x.sub),why:`${lt(x.b)}${x.a?' = '+lt(x.a):''}، ومكانه في فرع ${esc(CAT_AR[x.cat]||x.cat)} تحت ${lt(x.sub)}.`};
  });
  runMC(day,'sort','Tree Builder',items,it=>`<div class="q"><span class="who">رجّع المنتج ده لمكانه في الشجرة</span><div class="big lt">${esc(it.b)}</div>
    <div class="opts">${it.opts.map((o,k)=>`<button class="opt" data-o="${k}"><span class="lt">${esc(o)}</span></button>`).join('')}</div></div>`);
}
/* Full Prescription / Routine Builder: كل حالة فيها خانات، والمتدرب بيختار لكل خانة، وبعدين يسلّم الحالة كلها */
function gameBuild(day){
  const q=DAYDATA[day].build;
  const cases=q.data.map(c=>({...c,slots:c.slots.map(s=>{const o=shuffle(s.opts.map((t,k)=>({t,ok:k===s.ok})));return{...s,o}})}));
  const max=cases.reduce((a,c)=>a+c.slots.length,0);
  let i=0,score=0;
  const step=()=>{
    const c=cases[i],pick={};
    openOv(`${ovTop(esc(q.t))}<div class="pbar"><i style="width:${i/cases.length*100}%"></i></div>
      <div class="hud"><span>حالة <b>${i+1}</b> من ${cases.length}</span><span>النقط <b>${score}</b> من ${max}</span></div>
      <div class="q"><span class="who">${esc(c.who)}</span><p class="stem">${esc(c.stem)}</p>
        <div class="slots">${c.slots.map((s,si)=>`<fieldset class="slot" data-si="${si}"><legend>${esc(s.t)}</legend>
          <div class="opts">${s.o.map((o,oi)=>`<button type="button" class="opt" data-s="${si}:${oi}">${esc(o.t)}</button>`).join('')}</div><div class="sfb"></div></fieldset>`).join('')}</div>
        <button class="btn" id="chk" disabled>سلّم ${q.t==='Routine Builder'?'الروتين':'الروشتة'}</button><div id="fbx"></div></div>`);
    $('#ovroot').onclick=e=>{
      const o=e.target.closest('[data-s]');if(!o||o.disabled)return;
      const [si,oi]=o.dataset.s.split(':').map(Number);pick[si]=oi;
      o.closest('.slot').querySelectorAll('[data-s]').forEach(b=>b.classList.toggle('sel',b===o));
      $('#chk').disabled=Object.keys(pick).length<c.slots.length;
    };
    $('#chk').onclick=ev=>{
      ev.stopPropagation();let got=0;
      c.slots.forEach((s,si)=>{
        const box=document.querySelector(`.slot[data-si="${si}"]`),right=s.o[pick[si]].ok;if(right)got++;
        box.querySelectorAll('[data-s]').forEach(b=>{b.disabled=true;b.classList.remove('sel');const oi=+b.dataset.s.split(':')[1];if(s.o[oi].ok)b.classList.add('ok');else if(oi===pick[si])b.classList.add('no')});
        box.querySelector('.sfb').innerHTML=`<span class="${right?'okt':'not'}">${esc(s.why)}</span>`;
      });
      score+=got;$('#chk').remove();
      $('#fbx').innerHTML=`<div class="fb ${got===c.slots.length?'ok':'no'}"><b>${got} من ${c.slots.length} صح</b></div>
        <div style="margin-top:12px"><button class="btn" id="nx">${i<cases.length-1?'الحالة اللي بعدها':'النتيجة'}</button></div>`;
      $('#nx').focus();
      $('#nx').onclick=e2=>{e2.stopPropagation();i++;if(i<cases.length)step();else finish(day,'build',score,max)};
    };
  };
  step();
}
function play(v){
  const [d,g]=v.split(':'),day=+d;
  if(!dataComplete(day)&&!S.preview){toast('كمّل بيانات المنتجات الأول');return}
  if(g==='match')gameMatch(day);else if(g==='sort')gameSort(day);else gameBuild(day);
}

/* ================= ROUTER ================= */
function route(keepScroll){
  const h=(location.hash||'#home').slice(1),y=window.scrollY;
  if(h==='map')viewMap();
  else if(h==='board')viewBoard();
  else if(h.startsWith('day-'))viewDay(+h.slice(4));
  else viewHome();
  renderXP();
  if(keepScroll)window.scrollTo(0,y);
}
document.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeOv();return}
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();if($('#ovroot').innerHTML)killOv();go(g.dataset.go);return}
  if(e.target.closest('[data-go-refresh]')){viewBoard();return}
  const bt=e.target.closest('[data-bt]');if(bt){boardTab=bt.dataset.bt;viewBoard();return}
  const df=e.target.closest('[data-df]');if(df){dataFilter=df.dataset.df;route(true);return}
  const pr=e.target.closest('[data-prod]');if(pr){productForm(pr.dataset.prod);return}
  const p=e.target.closest('[data-play]');if(p&&!p.disabled){if(needUser())return;clearInterval(timer);play(p.dataset.play);return}
  const v=e.target.closest('[data-view]');if(v&&!v.disabled){viewer(v.dataset.view);return}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#ovroot').innerHTML)closeOv()});
window.addEventListener('hashchange',()=>{if($('#ovroot').innerHTML)killOv();route();window.scrollTo(0,0)});
route();flush();

</script>
